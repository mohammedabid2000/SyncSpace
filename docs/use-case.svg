<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000" stroke-width="1.5"/>
    </marker>
    <marker id="gen" viewBox="0 0 20 20" refX="19" refY="10" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M1,1 L19,10 L1,19 z" fill="#fff" stroke="#000" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>

  <!-- system boundary -->
  <rect x="290" y="40" width="680" height="730" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="630" y="72" text-anchor="middle" font-size="20" font-weight="bold">WatchParty</text>

  <g stroke="#000" stroke-width="1.6" fill="none">
    <!-- associations -->
    <line x1="170" y1="238" x2="382" y2="214"/>
    <line x1="170" y1="262" x2="385" y2="330"/>
    <line x1="170" y1="250" x2="682" y2="276"/>
    <line x1="170" y1="580" x2="384" y2="530"/>
    <line x1="170" y1="600" x2="386" y2="652"/>
    <line x1="1050" y1="580" x2="922" y2="580"/>
    <!-- generalization Host -> User -->
    <line x1="140" y1="528" x2="140" y2="322" marker-end="url(#gen)"/>
  </g>

  <!-- include / extend (dashed) -->
  <g stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="8 6">
    <line x1="614" y1="222" x2="700" y2="252" marker-end="url(#open)"/>
    <line x1="570" y1="490" x2="770" y2="306" marker-end="url(#open)"/>
    <line x1="800" y1="234" x2="800" y2="158" marker-end="url(#open)"/>
    <line x1="500" y1="302" x2="500" y2="248" marker-end="url(#open)"/>
    <line x1="614" y1="532" x2="690" y2="562" marker-end="url(#open)"/>
  </g>
  <g font-size="14" font-style="italic">
    <text x="662" y="228">&lt;&lt;include&gt;&gt;</text>
    <text x="682" y="410">&lt;&lt;include&gt;&gt;</text>
    <text x="810" y="200">&lt;&lt;include&gt;&gt;</text>
    <text x="492" y="285" text-anchor="end">&lt;&lt;include&gt;&gt;</text>
    <text x="640" y="528">&lt;&lt;include&gt;&gt;</text>
  </g>

  <!-- use cases -->
  <g fill="#fff" stroke="#000" stroke-width="1.6">
    <ellipse cx="800" cy="120" rx="140" ry="38"/>
    <ellipse cx="800" cy="270" rx="120" ry="36"/>
    <ellipse cx="500" cy="210" rx="120" ry="36"/>
    <ellipse cx="500" cy="340" rx="120" ry="38"/>
    <ellipse cx="500" cy="520" rx="120" ry="36"/>
    <ellipse cx="800" cy="580" rx="120" ry="40"/>
    <ellipse cx="500" cy="660" rx="120" ry="40"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="800" y="115">Validate credentials</text>
    <text x="800" y="136">&amp; generate JWT</text>
    <text x="800" y="276">Log in</text>
    <text x="500" y="216">Join a room</text>
    <text x="500" y="335">Watch live session</text>
    <text x="500" y="356" font-size="14">(WebRTC stream)</text>
    <text x="500" y="526">Create a room</text>
    <text x="800" y="575">Spawn Neko</text>
    <text x="800" y="596">browser container</text>
    <text x="500" y="655">Interactive control</text>
    <text x="500" y="676" font-size="14">(virtual browser)</text>
  </g>

  <!-- actors -->
  <g stroke="#000" stroke-width="2" fill="none">
    <circle cx="140" cy="200" r="16"/><line x1="140" y1="216" x2="140" y2="262"/>
    <line x1="110" y1="232" x2="170" y2="232"/><line x1="140" y1="262" x2="115" y2="296"/><line x1="140" y1="262" x2="165" y2="296"/>

    <circle cx="140" cy="560" r="16" transform="translate(0,-10)"/><line x1="140" y1="566" x2="140" y2="604"/>
    <line x1="110" y1="580" x2="170" y2="580"/><line x1="140" y1="604" x2="115" y2="638"/><line x1="140" y1="604" x2="165" y2="638"/>

    <circle cx="1080" cy="530" r="16"/><line x1="1080" y1="546" x2="1080" y2="592"/>
    <line x1="1050" y1="562" x2="1110" y2="562"/><line x1="1080" y1="592" x2="1055" y2="626"/><line x1="1080" y1="592" x2="1105" y2="626"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="140" y="318">User</text>
    <text x="140" y="660">Host</text>
    <text x="1080" y="650">Neko Engine</text>
    <text x="1080" y="670">Orchestrator</text>
  </g>
</svg>
