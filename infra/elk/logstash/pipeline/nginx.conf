input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "nginx"
  }
  if "_jsonparsefailure" in [tags] {
    drop {}
  }
  date {
    match => ["[nginx][timestamp]", "ISO8601"]
  }
  mutate {
    add_field => { "[service][name]" => "nginx" }
    remove_field => ["message", "[event][original]", "[nginx][timestamp]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "syncspace_log_writer"
    password => "${LOGSTASH_ES_PASSWORD}"
    index => "syncspace-nginx-access-%{+yyyy.MM.dd}"
    action => "create"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
