version: '3.8'

networks:
  database:
    internal: true   # No external access — only backend services can reach Mongo
  frontend:
  backend:

volumes:
  mongo_data:
  vault_data:
  elasticsearch_data:

services:
  # ---------- DATABASE ----------
  mongodb:
    image: mongo:7.0
    container_name: syncspace-mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- BACKEND (Dev 3 & Dev 4) ----------
  backend:
    build: ./services/backend
    container_name: syncspace-backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
      - database

  # ---------- FRONTEND (Dev 1) ----------
  frontend:
    build: ./services/frontend
    container_name: syncspace-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - frontend
      - backend

  # ---------- NEKO ORCHESTRATOR (Dev 2) ----------
  # Note: Neko containers are spawned dynamically, not defined here.
  # This service is the API that talks to the Docker daemon.
  orchestrator:
    build: ./services/orchestrator
    container_name: syncspace-orchestrator
    restart: unless-stopped
    env_file: .env
    volumes:
      # WARNING: For production, replace this with a docker-socket-proxy.
      # This is fine for local dev only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # ---------- VAULT (Dev 4) ----------
  vault:
    image: hashicorp/vault:1.15
    container_name: syncspace-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    networks:
      - backend
    ports:
      - "8200:8200"