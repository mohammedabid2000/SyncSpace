version: '3.8'

networks:
  database:
    internal: true
    driver : bridge
  frontend:
  backend:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  vault_data:
  elasticsearch_data:

services:
  # ---------- DATABASE ----------
  postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-syncspace}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-syncspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  # ---------- BACKEND (Dev 3 & Dev 4) ----------
  backend:
    build: ./services/backend
    container_name: syncspace-backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-syncspace}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - database
      - backend

  # ---------- FRONTEND (Dev 1) ----------
  frontend:
    build: ./services/frontend
    container_name: syncspace-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      - frontend
      - backend

  # ---------- NEKO ORCHESTRATOR (Dev 2) ----------
  # Note: Neko containers are spawned dynamically, not defined here.
  # This service is the API that talks to the Docker daemon.
  orchestrator:
    build: ./services/orchestrator
    container_name: syncspace-orchestrator
    restart: unless-stopped
    env_file: .env
    volumes:
      # WARNING: For production, replace this with a docker-socket-proxy.
      # This is fine for local dev only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # ---------- VAULT (Dev 4) ----------
  vault:
    image: hashicorp/vault:1.15
    container_name: syncspace-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    networks:
      - backend
    ports:
      - "8200:8200"
