version: '3.8'

networks:
  database:
    internal: true   # No external access — only backend services can reach Mongo
  frontend:
  backend:

volumes:
  mongo_data:
  vault_data:
  elasticsearch_data:

services:
  # ---------- DATABASE ----------
postgres:
    image: postgres:16-alpine
    container_name: syncspace-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- BACKEND (Dev 3 & Dev 4) ----------
  backend:
    build: ./services/backend
    container_name: syncspace-backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB_NAME}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
      - database

  # ---------- FRONTEND (Dev 1) ----------
  frontend:
    build: ./services/frontend
    container_name: syncspace-frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - frontend
      - backend

  # ---------- NEKO ORCHESTRATOR (Dev 2) ----------
  # Note: Neko containers are spawned dynamically, not defined here.
  # This service is the API that talks to the Docker daemon.
  orchestrator:
    build: ./services/orchestrator
    container_name: syncspace-orchestrator
    restart: unless-stopped
    env_file: .env
    volumes:
      # WARNING: For production, replace this with a docker-socket-proxy.
      # This is fine for local dev only.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - backend

  # ---------- VAULT (Dev 4) ----------
  vault:
    image: hashicorp/vault:1.15
    container_name: syncspace-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    networks:
      - backend
    ports:
      - "8200:8200"
