server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: if the URL is not a real file (e.g. /signin, /home, /stream),
    # send index.html and let React show the right page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS/images have a hash in their name, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: the browser must always check for a new service worker (never keep an old one)
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # PWA: nginx doesn't know the .webmanifest extension, so we give its type ourselves
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
